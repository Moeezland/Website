<script>
kofiWidgetOverlay.draw('moeezland', {
    'type': 'floating-chat',
    'floating-chat.donateButton.text': 'Support me',
    'floating-chat.donateButton.background-color': '#fcbf47',
    'floating-chat.donateButton.text-color': '#323842'
});
</script>

<script>

/* ==========================
   PAGE FEEDBACK
========================== */

const card = document.getElementById("feedbackCard");
const up = document.getElementById("thumbUp");
const down = document.getElementById("thumbDown");

function submitFeedback(){

    card.classList.add("feedback-success");

    card.innerHTML = `

        <div class="feedback-content">

            <h3>Thank you for your feedback!</h3>

            <p>
                We appreciate your feedback. Your response helps us
                improve the quality and accessibility of Moeezland
                eGov services.
            </p>

        </div>

        <div class="feedback-check">
            ✓
        </div>

    `;
}

up.addEventListener("click", submitFeedback);
down.addEventListener("click", submitFeedback);

</script>

<script src="js/component-loader.js"></script>

<script src="js/script.js"></script>

</body>
